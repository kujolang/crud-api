objective: "Replace HLP-011 parse_bool_env with native env_bool plus explicit fallback handling without changing configuration defaults."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: source_check
    command: "/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check src/config.kujo >/dev/null"
  - id: visible_api_tests
    command: "KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/t0_01_content_type_validation.sh && KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/t2_01_security_profile.sh"
    required: true
  - id: diff_check
    command: 'files=$(git diff --name-only | grep -v "^.loop-engineering/" || true); if [ -n "$files" ]; then git diff --check -- $files; fi'
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
